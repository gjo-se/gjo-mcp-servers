# Current default setup:
# - `docker compose up -d` starts only `doc-server` from `docker-compose.override.yml`
# - additional MCP services are opt-in via `--profile full-stack`
services:
  scraper-server:
    profiles: ["full-stack"]
    build: .
    command: ["python", "-m", "servers.scraper_server.server"]
    environment:
      HOST: 0.0.0.0
      PORT_SCRAPER: ${PORT_SCRAPER}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${PORT_SCRAPER}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcp_internal
      - mcp_external

  analyzer-server:
    profiles: ["full-stack"]
    build: .
    command: ["python", "-m", "servers.skills_analyzer_server.server"]
    environment:
      HOST: 0.0.0.0
      PORT_ANALYZER: ${PORT_ANALYZER}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${PORT_ANALYZER}:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcp_internal

  storage-server:
    profiles: ["full-stack"]
    build: .
    command: ["python", "-m", "servers.storage_server.server"]
    environment:
      HOST: 0.0.0.0
      PORT_STORAGE: ${PORT_STORAGE}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${PORT_STORAGE}:8003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcp_internal

  postgres:
    profiles: ["full-stack"]
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcp_internal

  playwright-mcp:
    profiles: ["full-stack"]
    build: ./servers/playwright
    command:
      [
        "npx",
        "@playwright/mcp",
        "--host",
        "0.0.0.0",
        "--port",
        "8005",
        "--caps=vision,pdf,testing",
      ]
    ports:
      - "${PORT_PLAYWRIGHT}:8005"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8005', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - mcp_external

networks:
  mcp_internal:
  mcp_external:

volumes:
  postgres_data:

