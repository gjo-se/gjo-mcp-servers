# Test-Umgebung Override für docker-compose.yml
#
# Verwendung:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#
# Änderungen gegenüber docker-compose.yml:
#   - SQLite statt PostgreSQL für alle Python-Server
#   - depends_on für alle Python-Server entfernt (kein postgres-Container nötig)
#   - postgres deaktiviert (profile "disabled")
#   - doc-server nicht Teil von docker-compose.yml → wird hier nicht referenziert
#
# Die pytest-Integration-Tests (tests/integration/) laufen in-process via
# fastmcp.Client – Docker ist NICHT erforderlich, um die Tests auszuführen.
# Diese Datei dient für optionale vollständige Docker-Systemtests.

services:
  scraper-server:
    depends_on: {}
    environment:
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"

  analyzer-server:
    depends_on: {}
    environment:
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"

  storage-server:
    depends_on: {}
    environment:
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"

  postgres:
    profiles:
      - "disabled"

