repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        language: system
        entry: uv run ruff check .
        pass_filenames: false
        always_run: true

      - id: black
        name: Black format check
        language: system
        entry: uv run black --check .
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (unit tests)
        language: system
        entry: uv run pytest --tb=short
        pass_filenames: false
        always_run: true

